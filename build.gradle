plugins {
    id 'fabric-loom' version '1.8-SNAPSHOT'
    id "org.jetbrains.kotlin.jvm" version "2.0.21"
    // The MongoDB driver has to travel inside the jar (optional cross-server key storage) and has to
    // be relocated, or a second mod bundling a different driver version wins the classpath.
    id 'com.gradleup.shadow' version '8.3.5'
}

sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21

archivesBaseName = project.archives_base_name
version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
}

loom {
    mods {
        "pebbles-crates" {
            sourceSet sourceSets.main
        }
    }
}

configurations {
    // Everything in here is shaded (and relocated) into the mod jar rather than nested with `include`:
    // jar-in-jar would leave `com.mongodb` on the shared classpath for every other mod to collide with.
    shadowBundle
    implementation.extendsFrom shadowBundle
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"


    implementation 'net.kyori:adventure-text-serializer-legacy:4.17.0'
    // adventure-platform-fabric is itself a Fabric mod: it has to go through modImplementation so
    // Loom remaps its mixins, otherwise runServer dies applying them against named Minecraft.
    modImplementation 'net.kyori:adventure-platform-fabric:5.14.2'
    implementation "net.kyori:adventure-api:4.17.0"
    implementation 'net.kyori:adventure-text-minimessage:4.17.0'
    // Pulled in transitively by the platform anyway; named here because the mod calls it directly
    // and an `include` has to name what it bundles.
    implementation 'net.kyori:adventure-text-serializer-gson:4.17.0'

    include 'net.kyori:adventure-platform-fabric:5.14.2'
    include 'net.kyori:adventure-text-serializer-legacy:4.17.0'
    include "net.kyori:adventure-api:4.17.0"
    include 'net.kyori:adventure-text-minimessage:4.17.0'
    include 'net.kyori:adventure-text-serializer-gson:4.17.0'

    compileOnly 'net.luckperms:api:5.4'

    // Sync driver only: every call already runs on the mod's own IO thread, so the reactive stack
    // would just add weight. slf4j comes from Minecraft, it must not be duplicated into the jar.
    shadowBundle('org.mongodb:mongodb-driver-sync:4.11.5') {
        exclude group: 'org.slf4j'
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).all {
    kotlinOptions {
        jvmTarget = 21
    }
}

java {
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

/**
 * Shade + relocate before Loom remaps, so the published jar carries the driver under
 * `tech.sethi.pebbles.crates.shaded`. Relocation rewrites our own call sites too, so the mod code
 * keeps importing `com.mongodb` as usual; only the dev runtime sees the unrelocated packages.
 */
shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'

    relocate 'com.mongodb', 'tech.sethi.pebbles.crates.shaded.com.mongodb'
    relocate 'org.bson', 'tech.sethi.pebbles.crates.shaded.org.bson'

    // The driver ships SPI entries under META-INF/services that name relocated classes.
    mergeServiceFiles()

    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/maven/**'
    exclude 'META-INF/native-image/**'

    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

remapJar {
    dependsOn shadowJar
    inputFile = shadowJar.archiveFile
}

